name: Cron Probe
run-name: 'Cron Probe: 定时触发验证'

# 用途：验证 GitHub schedule 是否能被正常触发并成功运行。
# 零副作用：不 checkout、不改文件、不产生提交、不发送邮件、不上传 artifact，
# 只打印触发事件与 UTC / 北京时间，便于对照 cron 时刻计算实际延迟。
# 验证完成后可直接删除本文件（或由控制台停用），不影响任何业务链路。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 记录触发时刻
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "utc=$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "beijing=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "cron=*/10 * * * *"
          echo "probe ok"
