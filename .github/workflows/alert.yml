name: Alert Test
run-name: 'Alert Test: 告警通道测试'

# 供 Pages 控制台「发送测试告警」按钮调用（workflow_dispatch）。
# 独立于业务工作流：不会产生业务推送记录，也不会发送书籍；只发一封告警邮件。
# 与主工作流「失败告警邮件」步骤使用同一段内联脚本（Python 标准库，无需 checkout）。
on:
  workflow_dispatch:
    inputs:
      subject:
        description: '测试邮件标题'
        required: false
        default: '【测试】Kindle 推送告警'
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    environment: calibre-news
    env:
      relay: ${{ secrets.SMTP }}
      port: ${{ secrets.PORT }}
      encrypt: ${{ secrets.ENCRYPT }}
      secret: ${{ secrets.SECRET }}
      from: ${{ secrets.FROM }}
      ALERT_TO: ${{ vars.ALERT_TO }}
      ALERT_SUBJECT: ${{ github.event.inputs.subject }}
      ALERT_BODY: '这是一封测试告警邮件。收到即表示告警通道（SMTP 与收件人）配置正确；业务推送失败时会自动发送同样的告警。'
    steps:
      - name: 发送测试告警
        run: |
          python3 - <<'PYEOF'
          import os, sys, smtplib, ssl
          from email.message import EmailMessage
          from datetime import datetime, timezone, timedelta

          def e(k, d=''):
              return os.environ.get(k) or d

          host = e('relay') or e('SMTP')
          port = int(e('port') or e('PORT') or 465)
          user = e('from') or e('FROM')
          pwd = e('secret') or e('SECRET')
          enc = (e('encrypt') or e('ENCRYPT') or 'SSL').upper()
          to = e('ALERT_TO') or user
          if not all([host, user, pwd, to]):
              print('告警配置不完整，跳过发信（不影响原运行结果）')
              sys.exit(0)

          bj = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          url = 'https://github.com/%s/actions/runs/%s' % (
              e('GITHUB_REPOSITORY'), e('GITHUB_RUN_ID'))
          msg = EmailMessage()
          msg['From'] = user
          msg['To'] = to
          msg['Subject'] = e('ALERT_SUBJECT', 'Kindle 推送告警')
          msg.set_content('%s\n\n时间（北京时间）：%s\n运行详情：%s\n\n—— Kindle 推送控制台自动告警'
                          % (e('ALERT_BODY', '推送任务异常'), bj, url))
          try:
              ctx = ssl.create_default_context()
              if enc == 'SSL':
                  with smtplib.SMTP_SSL(host, port, context=ctx, timeout=20) as s:
                      s.login(user, pwd)
                      s.send_message(msg)
              else:
                  with smtplib.SMTP(host, port, timeout=20) as s:
                      s.starttls(context=ctx)
                      s.login(user, pwd)
                      s.send_message(msg)
              print('告警邮件已发送 ->', to)
          except Exception as ex:
              print('告警邮件发送失败:', repr(ex))
              sys.exit(1)
          PYEOF
